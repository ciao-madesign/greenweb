<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Footprint Counter</title>
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="brand"><img src="../icons/leaf-green-48.png" alt="" width="26" height="26"><span data-i18n="options.title"></span></div>
      <nav><a href="../dashboard/dashboard.html" data-i18n="nav.dashboard"></a></nav>
    </header>

    <section class="card">
      <h2 data-i18n="options.general"></h2>
      <label><span data-i18n="options.metric"></span><select id="metric"></select></label>
      <label><span data-i18n="options.profile"></span><select id="profile"></select></label>
      <label><span data-i18n="options.device"></span><select id="device"></select></label>
      <label><span data-i18n="options.language"></span><select id="lang"></select></label>
    </section>

    <section class="card" id="privacy">
      <h2 data-i18n="options.privacy"></h2>
      <p class="note" data-i18n="options.private_note"></p>
      <label class="check"><input type="checkbox" id="paused"><span><b data-i18n="options.pause"></b><small data-i18n="options.pause_hint"></small></span></label>
      <label><span data-i18n="options.retention"></span><select id="retention"></select></label>
      <label><span data-i18n="options.excluded"></span><textarea id="excluded" rows="4" spellcheck="false" placeholder="mybank.com"></textarea><small data-i18n="options.excluded_hint"></small></label>
      <label class="check"><input type="checkbox" id="destinations"><span><b data-i18n="options.dest"></b><small data-i18n="options.dest_hint"></small></span></label>
      <fieldset class="ai">
        <legend data-i18n="options.ai"></legend>
        <p class="note" data-i18n="options.ai_hint"></p>
        <div id="ai-list"></div>
        <div id="ai-diag" class="diag" hidden>
          <p class="note" id="ai-diag-status" role="status"></p>
          <div class="scroll"><table id="ai-diag-table"><thead><tr>
            <th data-i18n="diag.request"></th><th data-i18n="diag.times"></th><th data-i18n="diag.status"></th><th data-i18n="diag.counted"></th>
          </tr></thead><tbody></tbody></table></div>
          <button type="button" id="ai-diag-copy" class="plain" data-i18n="options.ai_diag_copy"></button>
          <p class="note" data-i18n="options.ai_diag_note"></p>
        </div>
        <button type="button" id="ai-delete" class="plain" data-i18n="options.ai_delete"></button>
      </fieldset>
      <p class="note" id="summary"></p>
      <div class="row">
        <button id="export" class="plain" data-i18n="options.export"></button>
        <button id="export-dest" class="plain" data-i18n="options.export_dest"></button>
        <button id="delete" data-i18n="options.delete"></button>
      </div>
    </section>

    <details class="card">
      <summary data-i18n="options.advanced"></summary>
      <p class="note" data-i18n="options.advanced_hint"></p>
      <label><span data-i18n="options.co2factor"></span><input id="co2" type="number" min="0" step="any"></label>
      <label><span id="price-label"></span><input id="price" type="number" min="0" step="any"></label>
      <label><span data-i18n="options.threshold_low"></span><input id="low" type="number" min="0" step="any"></label>
      <label><span data-i18n="options.threshold_high"></span><input id="high" type="number" min="0" step="any"></label>
      <p class="note" data-i18n="options.threshold_hint"></p>
    </details>

    <details class="card" id="diag-card">
      <summary data-i18n="options.diag_title"></summary>
      <p class="note" data-i18n="options.diag_hint"></p>
      <p class="note" id="diag-states"></p>
      <p class="note" id="diag-last"></p>
    </details>

    <p id="status" class="note" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
