name: Site
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'scripts/build-site.sh', 'scripts/package.sh', 'manifest.json', 'src/**', 'modules/**', 'data/**', 'locales/**', 'dashboard/**', 'options/**', 'privacy/**', 'welcome/**', 'methodology/**', 'icons/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
