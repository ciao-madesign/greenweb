<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Footprint Counter</title>
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="methodology.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="brand"><img src="../icons/leaf-green-48.png" alt="" width="26" height="26"><span data-i18n="nav.methodology"></span></div>
      <nav><a href="../dashboard/dashboard.html" data-i18n="nav.dashboard"></a></nav>
    </header>

    <p class="lead" data-i18n="m.lead"></p>

    <section id="estimate" class="flow" aria-label="Calculation">
      <div class="node"><b data-i18n="flow.time"></b><span data-i18n="flow.time.sub"></span></div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="node core"><b data-i18n="flow.energy"></b><span data-i18n="flow.energy.sub"></span></div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="outs">
        <div class="node"><b data-i18n="flow.co2"></b><span data-i18n="flow.co2.sub"></span></div>
        <div class="node"><b data-i18n="flow.water"></b><span data-i18n="flow.water.sub"></span></div>
        <div class="node"><b data-i18n="flow.cost"></b><span data-i18n="flow.cost.sub"></span></div>
      </div>
    </section>

    <section class="trio">
      <div class="card"><h2 data-i18n="card.see.title"></h2><p data-i18n="card.see.body"></p></div>
      <div class="card" id="margins"><h2 data-i18n="card.sure.title"></h2><p data-i18n="card.sure.body"></p>
        <ul class="chips"><li class="rel-medium" data-i18n="reliability.medium" title=""></li><li class="rel-low" data-i18n="reliability.low"></li><li class="rel-unavailable" data-i18n="reliability.unavailable"></li></ul>
      </div>
      <div class="card" id="limits"><h2 data-i18n="card.cant.title"></h2>
        <ul><li data-i18n="cant.1"></li><li data-i18n="cant.2"></li><li data-i18n="cant.3"></li></ul>
      </div>
    </section>

    <details id="coefficients"><summary data-i18n="det.coef"></summary>
      <div class="scroll"><table id="coef-table"><thead><tr>
        <th data-i18n="mt.coef"></th><th data-i18n="mt.value"></th><th data-i18n="col.reliability"></th><th data-i18n="mt.status"></th><th data-i18n="mt.method"></th><th data-i18n="mt.sources"></th>
      </tr></thead><tbody></tbody></table></div>
    </details>
    <details id="profiles"><summary data-i18n="det.profiles"></summary>
      <div class="scroll"><table id="profile-table"><thead><tr>
        <th data-i18n="mt.region"></th><th>gCO₂e/kWh</th><th data-i18n="mt.price"></th><th data-i18n="mt.status_profile"></th><th data-i18n="mt.method"></th><th data-i18n="mt.sources"></th>
      </tr></thead><tbody></tbody></table></div>
    </details>
    <details id="equivalences"><summary data-i18n="det.eq"></summary>
      <div class="scroll"><table id="eq-table"><thead><tr>
        <th data-i18n="mt.coef"></th><th data-i18n="mt.value"></th><th data-i18n="mt.status"></th><th data-i18n="mt.method"></th><th data-i18n="mt.sources"></th>
      </tr></thead><tbody></tbody></table></div>
    </details>
    <details id="sources"><summary data-i18n="det.sources"></summary><ol id="source-list"></ol></details>

    <p class="muted small foot" data-i18n="m.license"></p>
  </main>
  <script type="module" src="methodology.js"></script>
</body>
</html>
