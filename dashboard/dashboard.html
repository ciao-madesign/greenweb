<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Footprint Counter</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <h1 data-i18n="app.title"></h1>
    <p><a href="#" id="settings-link" data-i18n="options.title"></a></p>
    <h2 data-i18n="dashboard.today"></h2>
    <p class="note" id="profile"></p>
    <p id="empty" hidden data-i18n="dashboard.empty"></p>
    <table id="table" hidden>
      <thead><tr>
        <th data-i18n="col.domain"></th><th data-i18n="col.category"></th>
        <th data-i18n="col.energy"></th><th data-i18n="col.co2e"></th><th data-i18n="col.water"></th><th data-i18n="col.cost"></th><th data-i18n="col.reliability"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <p class="note" data-i18n="dashboard.note"></p>
  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
