<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Footprint Counter</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="brand"><img src="../icons/leaf-green-48.png" alt="" width="26" height="26"><span data-i18n="app.title"></span></div>
      <nav><button type="button" id="pause" class="pause"></button><a href="#" id="settings-link" data-i18n="options.title"></a><a href="../methodology/methodology.html" data-i18n="nav.methodology"></a></nav>
    </header>

    <p id="paused-banner" class="banner" hidden data-i18n="pause.banner"></p>

    <div class="controls">
      <div class="seg-ctl" id="period" role="group" aria-label="Period"></div>
      <div class="seg-ctl" id="metric" role="group" aria-label="Metric"></div>
    </div>

    <section id="empty" class="empty" hidden>
      <img src="../icons/leaf-green-128.png" alt="" width="72" height="72">
      <p data-i18n="dashboard.empty"></p>
    </section>

    <div id="content">
      <section class="card hero">
        <div class="gauge-box"><div id="gauge"></div><div class="big" id="big"></div></div>
        <div class="hero-text">
          <div class="level" id="level"></div>
          <div class="muted" id="range"></div>
          <div class="muted" id="confidence"></div>
        </div>
      </section>

      <section>
        <h2 data-i18n="dash.eq"></h2>
        <div class="eq-grid" id="eq"></div>
      </section>

      <section class="two">
        <div class="card">
          <h2 data-i18n="dash.where"></h2>
          <div class="donut-box"><div id="donut"></div><ul class="legend" id="legend"></ul></div>
        </div>
        <div class="card">
          <h2 data-i18n="dash.top"></h2>
          <div id="top"></div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="dash.trend"></h2>
        <div id="trend"></div>
        <p class="muted small" data-i18n="dash.trend_hint"></p>
      </section>

      <details id="details">
        <summary data-i18n="dash.details"></summary>
        <div class="scroll"><table id="summary"><thead><tr>
          <th data-i18n="dash.period"></th><th data-i18n="col.energy"></th><th data-i18n="col.co2e"></th><th data-i18n="col.water"></th><th data-i18n="col.cost"></th><th data-i18n="col.reliability"></th>
        </tr></thead><tbody></tbody></table></div>
        <div class="scroll"><table id="sites"><thead><tr>
          <th data-i18n="col.domain"></th><th data-i18n="col.category"></th><th data-i18n="col.ops"></th><th data-i18n="col.prompts"></th>
          <th data-i18n="col.energy"></th><th data-i18n="col.co2e"></th><th data-i18n="col.water"></th><th data-i18n="col.cost"></th><th data-i18n="col.reliability"></th>
        </tr></thead><tbody></tbody></table></div>
      </details>
    </div>

    <p class="muted small foot"><span id="profile"></span> · <span data-i18n="dash.foot"></span> <a href="../methodology/methodology.html" data-i18n="nav.methodology"></a></p>
  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
